name: Mirror to GitLab

# Keeps gitlab.com/Phillipjr9/heritage-bank in sync with this repo so the
# Render service (heritage-bank-zr16, connected to GitLab) builds current code.
#
# Requires a repository secret GITLAB_TOKEN: a GitLab Project Access Token
# with the write_repository scope (role: Maintainer).

on:
  push:
    branches:
      - main
      - arena/01a0fbfb-heritage-bank
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to GitLab main
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
        run: |
          if [ -z "$GITLAB_TOKEN" ]; then
            echo "GITLAB_TOKEN secret is not set — skipping mirror."
            exit 1
          fi
          git push --force "https://oauth2:${GITLAB_TOKEN}@gitlab.com/Phillipjr9/heritage-bank.git" HEAD:main
